[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[bdist_wheel]
universal = 1

[project]
name = "txtflar"
version = "1.1.2a4"
dependencies = [
    "babelfish >= 0.6.1",
    "chardet >= 5.2.0",
    "langdetect >= 1.0.9",
    "importlib-metadata; python_version >= '3.11'"
]
readme = "README.md"
description = "TeXT file language-aware rename"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
keywords = ["subtitles", "rename", "language-detection", "srt", "cli"]
authors = [
  {name = "Luis López", email = "luis@cuarentaydos.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/ldotlopez/txtflar"
Issues = "https://github.com/ldotlopez/txtflar/issues"
Repository = "https://github.com/ldotlopez/txtflar.git"

[tool.setuptools]
packages = ["txtflar"]

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]

[project.scripts]
txtflar = "txtflar:main"
